---
# Install and initialise step-ca with an SSH CA on one Linux host of the inventory.
#   ansible-playbook playbooks/ca-setup.yml -e ca_host=<inventory name> -e 'ca_user_principals=["ansible"]'
# Re-running it is safe: it only updates the binaries (if the version changed),
# the provisioner and the principal policy. Principals listed in /etc/step-ca/extra-principals
# (written by ansible-ssh-key-distribution-step-ca) are kept in the policy.

- name: Set up step-ca
  hosts: "{{ ca_host }}"
  become: true
  gather_facts: true
  vars_files: [vars.yml]
  vars:
    step_cli_version: 0.28.6
    step_ca_version: 0.28.2
    ca_name: Ansible SSH CA
    ca_port: 9000
    ca_url_host: "{{ ansible_host | default(inventory_hostname) }}"
    ca_dir: /etc/step-ca
    ca_service_user: step
    # Principals the CA may put into SSH user certificates (the Ansible account names).
    ca_user_principals: [ansible]
    # Host certificate policy: empty lists = every host name except localhost.
    ca_host_allow_dns: []          # e.g. ["*.lab", "nas"]
    ca_host_allow_ips: []          # e.g. ["192.168.0.0/24"]
    ca_arch_map: {x86_64: amd64, aarch64: arm64, armv7l: armv7, armv6l: armv6, i386: "386", i686: "386"}
    ca_arch: "{{ ca_arch_map[ansible_facts['architecture']] | default('amd64') }}"
    ca_systemd: "{{ ansible_facts['service_mgr'] == 'systemd' }}"
  tasks:
    - name: Check the CA host
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ca_user_principals | length > 0
        fail_msg: "step-ca is set up on Linux hosts only and needs at least one user principal."

    - name: Check installed versions
      ansible.builtin.shell: |
        printf 'step=%s\n' "$(/usr/local/bin/step version 2>/dev/null | head -n1)"
        printf 'ca=%s\n' "$(/usr/local/bin/step-ca version 2>/dev/null | head -n1)"
      register: ca_versions
      changed_when: false

    - name: Install the step CLI
      when: ("Smallstep CLI/" ~ step_cli_version) not in ca_versions.stdout
      block:
        - name: Download step {{ step_cli_version }}
          ansible.builtin.unarchive:
            src: "https://github.com/smallstep/cli/releases/download/v{{ step_cli_version }}/step_linux_{{ step_cli_version }}_{{ ca_arch }}.tar.gz"
            dest: /tmp
            remote_src: true
        - name: Install /usr/local/bin/step
          ansible.builtin.copy:
            src: "/tmp/step_{{ step_cli_version }}/bin/step"
            dest: /usr/local/bin/step
            remote_src: true
            mode: "0755"

    - name: Install step-ca
      when: ("Smallstep CA/" ~ step_ca_version) not in ca_versions.stdout
      block:
        - name: Create download directory
          ansible.builtin.file:
            path: /tmp/step-ca-{{ step_ca_version }}
            state: directory
            mode: "0755"
        - name: Download step-ca {{ step_ca_version }}
          ansible.builtin.unarchive:
            src: "https://github.com/smallstep/certificates/releases/download/v{{ step_ca_version }}/step-ca_linux_{{ step_ca_version }}_{{ ca_arch }}.tar.gz"
            dest: /tmp/step-ca-{{ step_ca_version }}
            remote_src: true
        - name: Install /usr/local/bin/step-ca
          ansible.builtin.copy:
            src: "/tmp/step-ca-{{ step_ca_version }}/step-ca"
            dest: /usr/local/bin/step-ca
            remote_src: true
            mode: "0755"
          notify: Restart step-ca

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ ca_service_user }}"
        system: true
        home: "{{ ca_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create {{ ca_dir }}
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        state: directory
        owner: "{{ ca_service_user }}"
        group: "{{ ca_service_user }}"
        mode: "0700"

    - name: Create passwords (kept on the CA host only)
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/{{ item }}"
        content: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}\n"
        owner: "{{ ca_service_user }}"
        group: "{{ ca_service_user }}"
        mode: "0600"
        force: false
      loop: [password.txt, admin-password.txt, provisioner-password.txt]
      no_log: true

    - name: Initialise the CA with SSH support
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ ca_service_user }}"
          - --
          - /usr/local/bin/step
          - ca
          - init
          - --ssh
          - --deployment-type=standalone
          - "--name={{ ca_name }}"
          - "--dns={{ ca_url_host }}"
          - "--dns={{ ansible_facts['fqdn'] }}"
          - "--dns={{ ansible_facts['hostname'] }}"
          - "--address=:{{ ca_port }}"
          - --provisioner=admin
          - "--password-file={{ ca_dir }}/password.txt"
          - "--provisioner-password-file={{ ca_dir }}/admin-password.txt"
        creates: "{{ ca_dir }}/config/ca.json"
      environment:
        STEPPATH: "{{ ca_dir }}"
      notify: Restart step-ca

    - name: Read ca.json
      ansible.builtin.slurp:
        src: "{{ ca_dir }}/config/ca.json"
      register: ca_json_raw

    - name: Add the provisioner {{ ssh_ca_provisioner }}
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ ca_service_user }}"
          - --
          - /usr/local/bin/step
          - ca
          - provisioner
          - add
          - "{{ ssh_ca_provisioner }}"
          - --type=JWK
          - --create
          - "--password-file={{ ca_dir }}/provisioner-password.txt"
          - --ssh
          - "--ssh-user-default-dur={{ ssh_ca_user_cert_duration }}"
          - --ssh-user-max-dur=24h
          - "--ssh-host-default-dur={{ ssh_ca_host_cert_duration }}"
          - --ssh-host-max-dur=2160h
          - "--ca-config={{ ca_dir }}/config/ca.json"
      environment:
        STEPPATH: "{{ ca_dir }}"
      when: ssh_ca_provisioner not in ((ca_json_raw.content | b64decode | from_json).authority.provisioners | map(attribute='name') | list)
      notify: Restart step-ca

    - name: Read ca.json again
      ansible.builtin.slurp:
        src: "{{ ca_dir }}/config/ca.json"
      register: ca_json_raw

    - name: Read extra principals (maintained by ansible-ssh-key-distribution-step-ca)
      ansible.builtin.slurp:
        src: "{{ ca_dir }}/extra-principals"
      register: ca_extra_raw
      failed_when: false

    - name: Write the SSH policy (allowed principals and host names)
      vars:
        ca_json: "{{ ca_json_raw.content | b64decode | from_json }}"
        ca_extra_principals: "{{ (ca_extra_raw.content | default('') | b64decode).split() }}"
        ca_host_rules: >-
          {{ {'allow': dict(([('dns', ca_host_allow_dns)] if ca_host_allow_dns else [])
                            + ([('ip', ca_host_allow_ips)] if ca_host_allow_ips else []))}
             if (ca_host_allow_dns or ca_host_allow_ips) else {'deny': {'dns': ['localhost', 'localhost.localdomain']}} }}
        ca_policy: "{{ {'ssh': {'user': {'allow': {'principal': (ca_user_principals + ca_extra_principals) | unique}}, 'host': ca_host_rules}} }}"
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/config/ca.json"
        content: "{{ ca_json | combine({'authority': ca_json.authority | combine({'policy': ca_policy})}) | to_nice_json(indent=2) }}\n"
        owner: "{{ ca_service_user }}"
        group: "{{ ca_service_user }}"
        mode: "0600"
      notify: Restart step-ca

    - name: Install the systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/step-ca.service
        mode: "0644"
        content: |
          [Unit]
          Description=step-ca (SSH certificate authority for Ansible)
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ ca_service_user }}
          Group={{ ca_service_user }}
          Environment=STEPPATH={{ ca_dir }}
          WorkingDirectory={{ ca_dir }}
          ExecStart=/usr/local/bin/step-ca config/ca.json --password-file password.txt
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=yes
          ProtectSystem=full
          ProtectHome=yes
          PrivateTmp=yes

          [Install]
          WantedBy=multi-user.target
      when: ca_systemd
      notify: Restart step-ca

    - name: Enable step-ca
      ansible.builtin.systemd_service:
        name: step-ca
        enabled: true
        daemon_reload: true
      when: ca_systemd

    - name: Start step-ca now (applies pending changes)
      ansible.builtin.meta: flush_handlers

    - name: Start step-ca without systemd (containers)
      ansible.builtin.shell: |
        pgrep -u {{ ca_service_user }} -x step-ca >/dev/null && exit 0
        cd {{ ca_dir }} && STEPPATH={{ ca_dir }} setsid nohup runuser -u {{ ca_service_user }} -- \
          /usr/local/bin/step-ca config/ca.json --password-file password.txt >>{{ ca_dir }}/step-ca.log 2>&1 < /dev/null &
        echo started
      register: ca_nosystemd
      changed_when: "'started' in ca_nosystemd.stdout"
      when: not ca_systemd

    - name: Wait for step-ca
      ansible.builtin.wait_for:
        port: "{{ ca_port }}"
        timeout: 30

    - name: Read the root fingerprint
      ansible.builtin.command: /usr/local/bin/step certificate fingerprint {{ ca_dir }}/certs/root_ca.crt
      register: ca_fingerprint
      changed_when: false

    - name: Read the provisioner password
      ansible.builtin.slurp:
        src: "{{ ca_dir }}/provisioner-password.txt"
      register: ca_provisioner_password
      no_log: true

    - name: Store CA access data on the control node
      delegate_to: localhost
      become: false
      block:
        - name: Create {{ ssh_ca_dir }}
          ansible.builtin.file:
            path: "{{ ssh_ca_dir }}"
            state: directory
            mode: "0700"
        - name: Write ca-info.env
          ansible.builtin.copy:
            dest: "{{ ssh_ca_dir }}/ca-info.env"
            mode: "0600"
            content: |
              CA_URL=https://{{ ca_url_host }}:{{ ca_port }}
              CA_FINGERPRINT={{ ca_fingerprint.stdout | trim }}
              PROVISIONER={{ ssh_ca_provisioner }}
        - name: Write provisioner-password
          ansible.builtin.copy:
            dest: "{{ ssh_ca_provisioner_password_file }}"
            content: "{{ ca_provisioner_password.content | b64decode }}"
            mode: "0600"
          no_log: true

    - name: Summary
      ansible.builtin.debug:
        msg: "step-ca runs at https://{{ ca_url_host }}:{{ ca_port }} (root fingerprint {{ ca_fingerprint.stdout | trim }})."

  handlers:
    - name: Restart step-ca (systemd)
      listen: Restart step-ca
      ansible.builtin.systemd_service:
        name: step-ca
        state: restarted
        daemon_reload: true
      when: ca_systemd

    - name: Stop step-ca (no systemd, started again by the next task)
      listen: Restart step-ca
      ansible.builtin.shell: |
        pkill -u {{ ca_service_user }} -x step-ca || true
        for i in $(seq 50); do pgrep -u {{ ca_service_user }} -x step-ca >/dev/null || break; sleep 0.2; done
      when: not ca_systemd
